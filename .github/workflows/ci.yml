name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: build
        run: make build
      - uses: azure/setup-kubectl@v4
      - name: e2e
        run: make e2e
